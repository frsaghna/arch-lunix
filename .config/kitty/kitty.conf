# Kitty Configuration
# Typography
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Window styling & remote control
allow_remote_control yes
listen_on            unix:/tmp/kitty-socket
window_padding_width 14 18
background_opacity   0.65
background_blur      32
dynamic_background_opacity yes
hide_window_decorations yes
confirm_os_window_close 0

# Cursor Aesthetics
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0
cursor_trail          3
cursor_trail_decay    0.1 0.4
cursor_trail_start_threshold 2

# Tab Bar (Minimalist - only shown with 2+ tabs)
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_title_template      " {index}: {tab.active_exe or title} "
active_tab_font_style   bold
inactive_tab_font_style normal

# Performance & Shell Integration
repaint_delay        10
input_delay          3
sync_to_monitor      yes
enable_audio_bell    no
visual_bell_duration 0.0
shell_integration    enabled

# Scrollback & Mouse
scrollback_lines     10000
mouse_hide_wait      3.0
detect_urls          yes
url_style            curly
underline_hyperlinks hover

# Color Scheme
include colors.conf

# Universal Copy / Paste / Cut
map super+c copy_to_clipboard
map super+v paste_from_clipboard
map super+x cut_to_clipboard
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
